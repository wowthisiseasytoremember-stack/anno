name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ReliquaryExplorer && xcodegen generate
      - name: Build ReliquaryExplorer (iOS)
        run: xcodebuild -project ReliquaryExplorer/ReliquaryExplorer.xcodeproj -scheme ReliquaryExplorer -destination 'generic/platform=iOS' build
