<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Anno Today screen concept</title>
  <desc id="desc">Dark mode iPhone Today screen for Anno showing date, saint, art, map pin, confidence, and prayer.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17140F"/>
      <stop offset="100%" stop-color="#0F0D0B"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#262018"/>
      <stop offset="100%" stop-color="#1F1B16"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#46351E"/>
      <stop offset="40%" stop-color="#17110D"/>
      <stop offset="100%" stop-color="#6E241B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="430" height="932" rx="48" fill="#050505"/>
  <rect x="13" y="14" width="404" height="904" rx="42" fill="url(#screen)"/>
  <rect x="156" y="28" width="118" height="31" rx="16" fill="#060606"/>
  <text x="42" y="52" fill="#EDE7DA" font-family="SF Pro, -apple-system, sans-serif" font-size="16" font-weight="600">9:41</text>
  <text x="356" y="52" fill="#EDE7DA" font-family="SF Pro, -apple-system, sans-serif" font-size="14">▰▰▰</text>

  <g transform="translate(34 84)">
    <circle cx="22" cy="22" r="22" fill="#1F1B16" stroke="#2E2A24"/>
    <text x="22" y="30" fill="#C9A84C" font-family="Georgia, serif" font-size="28" text-anchor="middle">A</text>
    <text x="62" y="18" fill="#EDE7DA" font-family="Georgia, serif" font-size="28">Anno</text>
    <text x="62" y="40" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="11" letter-spacing="1.5">THIS DAY IN CATHOLIC HISTORY</text>
    <rect x="304" y="4" width="54" height="35" rx="18" fill="#251F17" stroke="#3A3024"/>
    <text x="331" y="27" fill="#C9A84C" font-family="SF Pro, -apple-system, sans-serif" font-size="13" text-anchor="middle">7 days</text>
  </g>

  <g transform="translate(34 158)">
    <text x="0" y="44" fill="#EDE7DA" font-family="Georgia, 'New York', serif" font-size="48">July 16</text>
    <text x="2" y="72" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="15">Wednesday • Optional Memorial</text>
    <rect x="0" y="96" width="362" height="42" rx="21" fill="#1F1B16" stroke="#2E2A24"/>
    <circle cx="24" cy="117" r="6" fill="#2B4A7C"/>
    <text x="43" y="122" fill="#EDE7DA" font-family="SF Pro, -apple-system, sans-serif" font-size="14">Our Lady of Mount Carmel</text>
    <text x="286" y="122" fill="#C9A84C" font-family="SF Pro, -apple-system, sans-serif" font-size="12">source ✓</text>
  </g>

  <g transform="translate(34 320)" filter="url(#shadow)">
    <rect width="362" height="264" rx="24" fill="url(#surface)" stroke="#2E2A24"/>
    <rect x="18" y="18" width="326" height="156" rx="18" fill="url(#art)"/>
    <circle cx="244" cy="77" r="35" fill="#C9A84C" opacity="0.18"/>
    <path d="M95 144 C120 96 145 84 169 108 C196 135 222 92 260 78" fill="none" stroke="#D9C06E" stroke-width="4" opacity="0.75"/>
    <path d="M118 48 L160 129 L82 129 Z" fill="#EDE7DA" opacity="0.08"/>
    <text x="24" y="205" fill="#EDE7DA" font-family="Georgia, 'New York', serif" font-size="24">The Scapular Tradition</text>
    <text x="24" y="228" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="13">Madonna del Carmine • provenance pending</text>
    <rect x="24" y="240" width="105" height="1" fill="#2E2A24"/>
  </g>

  <g transform="translate(34 608)">
    <rect width="362" height="68" rx="18" fill="#1F1B16" stroke="#2E2A24"/>
    <text x="24" y="31" fill="#C9A84C" font-family="SF Pro, -apple-system, sans-serif" font-size="22">⌖</text>
    <text x="56" y="29" fill="#EDE7DA" font-family="SF Pro, -apple-system, sans-serif" font-size="16">Mount Carmel, Israel</text>
    <text x="56" y="49" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="12">Open pilgrimage pin</text>
    <text x="326" y="42" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="24">›</text>
  </g>

  <g transform="translate(34 696)">
    <rect width="105" height="34" rx="17" fill="#3B6B52"/>
    <text x="52" y="22" fill="#EDE7DA" font-family="SF Pro, -apple-system, sans-serif" font-size="12" text-anchor="middle">✓ Confirmed</text>
    <rect x="116" width="112" height="34" rx="17" fill="#1F1B16" stroke="#2E2A24"/>
    <text x="172" y="22" fill="#EDE7DA" font-family="SF Pro, -apple-system, sans-serif" font-size="12" text-anchor="middle">Sources (3)</text>
    <rect x="240" width="122" height="34" rx="17" fill="#1F1B16" stroke="#2E2A24"/>
    <text x="301" y="22" fill="#C9A84C" font-family="SF Pro, -apple-system, sans-serif" font-size="12" text-anchor="middle">Listen sample</text>
  </g>

  <g transform="translate(34 754)">
    <text x="0" y="0" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="11" letter-spacing="1.3">PRAYER FOR TODAY</text>
    <rect x="0" y="16" width="362" height="1" fill="#2E2A24"/>
    <text x="0" y="48" fill="#EDE7DA" font-family="Georgia, 'New York', serif" font-size="19">Mary, keep our memory faithful:</text>
    <text x="0" y="77" fill="#9B9085" font-family="Georgia, 'New York', serif" font-size="17">teach us to carry history as a light,</text>
    <text x="0" y="104" fill="#9B9085" font-family="Georgia, 'New York', serif" font-size="17">not as a weight.</text>
  </g>

  <rect x="30" y="866" width="370" height="46" rx="23" fill="#1F1B16" stroke="#2E2A24"/>
  <text x="70" y="896" fill="#C9A84C" font-family="SF Pro, -apple-system, sans-serif" font-size="12" text-anchor="middle">Today</text>
  <text x="160" y="896" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="12" text-anchor="middle">Calendar</text>
  <text x="250" y="896" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="12" text-anchor="middle">Map</text>
  <text x="340" y="896" fill="#9B9085" font-family="SF Pro, -apple-system, sans-serif" font-size="12" text-anchor="middle">Saved</text>
</svg>

