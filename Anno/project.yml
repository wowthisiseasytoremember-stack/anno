name: Anno
options:
  bundleIdPrefix: org.anno
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: ""

targets:
  Anno:
    type: application
    platform: iOS
    sources:
      - path: .
        # Keep unfinished/deferred architectures in-repo without compiling them
        # into the narrow fixture-driven v1 app.
        excludes:
          - AppRouter.swift
          - Components/GlassCard.swift
          - Components/ShareableImage.swift
          - Components/ShareCard.swift
          - Components/VerseActionBar.swift
          - Models/Artwork.swift
          - Models/AudioNarrationTrack.swift
          - Models/Devotional.swift
          - Models/Bookmark.swift
          - Models/FieldNote.swift
          - Models/Journey.swift
          - Models/SacredPlace.swift
          - Models/Visit.swift
          - Services/AnnoDevotionalLoader.swift
          - Services/AudioDevotionalPlayer.swift
          - Services/BookmarkActions.swift
          - Services/DailyDevotionalLoader.swift
          - Services/DevotionalProvider.swift
          - Services/ContentImportService.swift
          - Services/NotificationService.swift
          - Services/SacredSpatialAudioEngine.swift
          - Services/SearchHistory.swift
          - Saved/SavedView.swift
          - Paywall/ArchivePaywallView.swift
          - Paywall/ProductCopy.swift
          - ViewModels/StoreViewModel.swift
    resources:
      - Resources/*
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Anno
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: org.anno.Anno

schemes:
  Anno:
    build:
      targets:
        Anno: all
    run:
      config: Debug
    test:
      config: Debug
