name: Anno
options:
  bundleIdPrefix: org.anno
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  AnnoPilgrimageMap:
    path: ../ios
  PilgrimCore:
    path: ../ReliquaryExplorer/Packages/PilgrimCore

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: ""

targets:
  Anno:
    type: application
    platform: iOS
    sources:
      - path: .
    dependencies:
      - package: AnnoPilgrimageMap
      - package: PilgrimCore
    resources:
      - Resources/*
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Anno
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: >
          The camera is used by ARKit to detect surfaces so you can place
          3-D reliquaries and Passion textiles in your physical space.
          No images leave your device.
        NSLocationWhenInUseUsageDescription: >
          Your location shows sanctuaries on the map and calibrates
          distances while the app is open.
        NSLocationAlwaysAndWhenInUseUsageDescription: >
          The Pilgrim Guide monitors sanctuary geofences in the background
          so narration begins automatically as you approach each sacred
          site on the pilgrimage route — no continuous GPS, no map open.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: org.anno.Anno

schemes:
  Anno:
    build:
      targets:
        Anno: all
    run:
      config: Debug
    test:
      config: Debug