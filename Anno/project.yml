name: Anno
options:
  bundleIdPrefix: org.anno
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: ""

targets:
  Anno:
    type: application
    platform: iOS
    sources:
      - path: .
        # Keep unfinished/deferred architectures in-repo without compiling them
        # into the narrow fixture-driven v1 app.
        excludes:
          - AppRouter.swift
          - Components/VerseActionBar.swift
          - Models/Artwork.swift
          - Models/AudioNarrationTrack.swift
          - Models/Bookmark.swift
          - Models/FieldNote.swift
          - Models/Journey.swift
          - Models/SacredPlace.swift
          - Models/Visit.swift
          - Services/AudioDevotionalPlayer.swift
          - Services/BookmarkActions.swift
          - Services/ContentImportService.swift
          - Services/SacredSpatialAudioEngine.swift
          - ViewModels/StoreViewModel.swift
    resources:
      - Resources/*
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Anno
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: >
          Your location shows pilgrimage waypoints and feast sites on the map while the app is open.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: org.anno.Anno

schemes:
  Anno:
    build:
      targets:
        Anno: all
    run:
      config: Debug
    test:
      config: Debug
